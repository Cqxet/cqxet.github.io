<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cqxet · 3D Props</title>
<meta name="description" content="3D props for Unity, shown as interactive low-detail previews.">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#1c1f24; --muted:#5d6570; --line:#dfe2e7; --accent:#2f6df6; --viewer:#e9ebef;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14161a; --card:#1d2026; --text:#eceef1; --muted:#9aa2ad; --line:#2c3038; --accent:#6c9bff; --viewer:#262a31; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}
  header{padding:48px 0 16px}
  h1{margin:0 0 6px;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em}
  header p{margin:0;color:var(--muted);max-width:60ch}
  .actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-block;padding:9px 16px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:15px}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  nav{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 4px}
  nav a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--text);text-decoration:none;font-size:14px;background:var(--card)}
  section{padding-top:28px}
  section h2{margin:0;font-size:22px}
  section > p{margin:4px 0 0;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:16px 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  model-viewer{width:100%;height:240px;background:var(--viewer);--poster-color:transparent}
  .meta{padding:12px 14px 14px}
  .meta h3{margin:0;font-size:16px}
  .empty{color:var(--muted);padding:40px 0}
  footer{border-top:1px solid var(--line);margin-top:40px;padding:24px 0 40px;color:var(--muted);font-size:14px}
  noscript{display:block;padding:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="name">Cqxet</h1>
    <p id="tagline"></p>
    <div class="actions" id="actions"></div>
  </header>
  <noscript>This page needs JavaScript to show the 3D previews.</noscript>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer>
    Drag to rotate · scroll or pinch to zoom. These are low-detail previews; the full-quality assets are sold separately.
    All content © <span id="year"></span> <span id="owner"></span>. Not licensed for reuse or redistribution.
  </footer>
</div>
<script>
(function(){
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  document.getElementById('year').textContent = new Date().getFullYear();

  fetch('data.json', { cache: 'no-cache' }).then(function(r){ return r.json(); }).then(function(data){
    var S = data.site || {};
    document.getElementById('name').textContent = S.name || 'Portfolio';
    document.getElementById('owner').textContent = S.name || '';
    document.title = (S.name || 'Portfolio') + ' · 3D Props';
    document.getElementById('tagline').textContent = S.tagline || '';

    var actions = document.getElementById('actions');
    function link(text, href, ghost){
      var a = el('a', 'btn' + (ghost ? ' ghost' : ''), text);
      a.href = href; actions.appendChild(a);
    }
    if (S.storeUrl) link('Unity Asset Store', S.storeUrl, false);
    if (S.email) link('Contact', 'mailto:' + S.email, true);

    var groups = (data.groups || []).filter(function(g){ return g.items && g.items.length; });
    var main = document.getElementById('main'), nav = document.getElementById('nav');
    if (!groups.length) { main.appendChild(el('p', 'empty', 'New packs are coming soon.')); return; }

    groups.forEach(function(g){
      if (groups.length > 1) {
        var a = el('a', null, g.name); a.href = '#g-' + g.id; nav.appendChild(a);
      }
      var sec = el('section'); sec.id = 'g-' + g.id;
      sec.appendChild(el('h2', null, g.name));
      if (g.description) sec.appendChild(el('p', null, g.description));
      var grid = el('div', 'grid');
      g.items.forEach(function(m){
        var card = el('article', 'card');
        var mv = document.createElement('model-viewer');
        mv.setAttribute('src', 'previews/' + m.id + '.glb');
        mv.setAttribute('alt', '3D preview: ' + m.title);
        mv.setAttribute('camera-controls', '');
        mv.setAttribute('auto-rotate', '');
        mv.setAttribute('loading', 'lazy');
        mv.setAttribute('shadow-intensity', '1');
        mv.setAttribute('environment-image', 'neutral');
        mv.setAttribute('interaction-prompt', 'none');
        mv.addEventListener('contextmenu', function(e){ e.preventDefault(); });
        var meta = el('div', 'meta'); meta.appendChild(el('h3', null, m.title));
        card.appendChild(mv); card.appendChild(meta); grid.appendChild(card);
      });
      sec.appendChild(grid); main.appendChild(sec);
    });
  }).catch(function(){
    document.getElementById('main').appendChild(el('p', 'empty', 'Could not load the catalog.'));
  });
})();
</script>
</body>
</html>
